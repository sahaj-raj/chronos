<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="chronosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Rounded Background for Tab Contrast -->
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#chronosGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Astrolabe Time Marks (Outer Ring) -->
  <circle cx="32" cy="32" r="27" stroke="url(#chronosGrad)" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.45"/>
  <circle cx="32" cy="5" r="1.5" fill="#38BDF8"/>
  <circle cx="59" cy="32" r="1.5" fill="#38BDF8"/>
  <circle cx="32" cy="59" r="1.5" fill="#38BDF8"/>
  <circle cx="5" cy="32" r="1.5" fill="#38BDF8"/>

  <!-- Hourglass End Plates (Gold/Bronze) -->
  <rect x="15" y="10" width="34" height="4" rx="2" fill="url(#goldGrad)"/>
  <rect x="18" y="14" width="28" height="2" rx="1" fill="#B45309" fill-opacity="0.8"/>
  <rect x="18" y="48" width="28" height="2" rx="1" fill="#B45309" fill-opacity="0.8"/>
  <rect x="15" y="50" width="34" height="4" rx="2" fill="url(#goldGrad)"/>

  <!-- Hourglass Glass Chamber -->
  <path d="M19 16 C19 28 29 30 31 32 C29 34 19 36 19 48 L45 48 C45 36 35 34 33 32 C35 30 45 28 45 16 Z"
        fill="#1E293B" fill-opacity="0.6" stroke="#93C5FD" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Upper Sand Level (Time In Reserve) -->
  <path d="M22 21 C24 20 40 20 42 21 C41 26 36 29 32 30 C28 29 23 26 22 21 Z"
        fill="url(#sandGrad)"/>

  <!-- Flowing Sand Stream of Time -->
  <line x1="32" y1="30" x2="32" y2="44" stroke="#FDE047" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Lower Sand Mound (Accumulating Epochs) -->
  <path d="M22 47 C25 43 39 43 42 47 Z"
        fill="url(#sandGrad)"/>

  <!-- Chrono Light Sparkles -->
  <circle cx="32" cy="35" r="1" fill="#FFFFFF"/>
  <circle cx="31" cy="39" r="0.8" fill="#FEF08A"/>
  <circle cx="33" cy="42" r="0.8" fill="#FFFFFF"/>

  <!-- Glass Light Reflections -->
  <path d="M21 18 C20 22 22 26 25 28" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M21 46 C20 42 22 38 25 36" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>